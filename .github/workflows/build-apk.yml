
name: Build DreamX Homes APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build DreamX Homes APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Configure Android SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      # 5. Find SDK Manager
      - name: Find SDK Manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

      # 6. Accept licenses
      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      # 7. Install SDK
      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. Extract project
      - name: Extract DreamX Homes project
        run: |
          if [ ! -f DreamX_Homes_Android_Project.zip ]; then
            echo "Android project ZIP not found"
            exit 1
          fi

          mkdir -p android-project

          unzip -o DreamX_Homes_Android_Project.zip \
            -d android-project

          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle

      # 9. Automatically fix Java/Kotlin JVM targets
      - name: Fix Java and Kotlin compatibility
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android-project/app/build.gradle")
          content = path.read_text()

          if "compileOptions" not in content:
              marker = "    defaultConfig {"
              if marker not in content:
                  raise SystemExit("defaultConfig block not found")

              start = content.index(marker)
              depth = 0
              end = None

              for i in range(start, len(content)):
                  if content[i] == "{":
                      depth += 1
                  elif content[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("Could not locate defaultConfig end")

              content = (
                  content[:end] +
                  """

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """ + content[end:]
              )

          if "kotlinOptions" not in content:
              pos = content.rfind("}")
              if pos < 0:
                  raise SystemExit("Android block closing brace not found")

              content = (
                  content[:pos] +
                  """
              kotlinOptions {
                  jvmTarget = '17'
              }
          """ + content[pos:]
              )

          path.write_text(content)

          print("Updated app/build.gradle:")
          print(content)
          PY

      # 10. Build APK
      - name: Build DreamX Homes APK
        run: |
          gradle --no-daemon \
            -p android-project \
            clean assembleDebug

      # 11. Verify APK
      - name: Verify APK
        run: |
          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not generated"
            exit 1
          fi

          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload DreamX Homes APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamX-Homes-Android-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
