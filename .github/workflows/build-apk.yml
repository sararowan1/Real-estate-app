
name: Build DreamX Homes APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dreamx-homes-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DreamX Homes APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Configure Android SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # 5. Find SDK Manager
      - name: Find SDK Manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # 6. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      # 7. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. Extract Android project
      - name: Extract DreamX Homes project
        run: |
          set -e

          test -f DreamX_Homes_Android_Project.zip

          mkdir -p android-project

          unzip -q -o DreamX_Homes_Android_Project.zip \
            -d android-project

          # Support ZIP files containing a nested project directory
          if [ ! -f android-project/settings.gradle ] && \
             [ ! -f android-project/settings.gradle.kts ]; then

            PROJECT_DIR=$(find android-project -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "Android project settings.gradle not found"
              exit 1
            fi

            if [ "$PROJECT_DIR" != "android-project" ]; then
              cp -a "$PROJECT_DIR"/. android-project/
            fi
          fi

          test -f android-project/app/build.gradle -o \
               -f android-project/app/build.gradle.kts

          test -f android-project/app/src/main/AndroidManifest.xml

          echo "Android project extracted successfully."

      # 9. Verify project configuration
      - name: Verify Android project configuration
        working-directory: android-project
        run: |
          set -e

          echo "Project settings:"
          ls -la

          echo "App Gradle configuration:"
          if [ -f app/build.gradle ]; then
            cat app/build.gradle
          else
            cat app/build.gradle.kts
          fi

          echo "Checking required Kotlin files..."

          find app/src/main -type f \
            \( -name "*.kt" -o -name "*.java" \) \
            -print

          test -f app/src/main/AndroidManifest.xml

      # 10. Verify version configuration
      - name: Check application version
        working-directory: android-project
        run: |
          set -e

          GRADLE_FILE="app/build.gradle"

          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="app/build.gradle.kts"
          fi

          echo "Using $GRADLE_FILE"

          grep -E "versionCode|versionName" "$GRADLE_FILE" || true

      # 11. Build debug APK
      - name: Build DreamX Homes APK
        run: |
          set -e

          gradle --no-daemon \
            -p android-project \
            clean assembleDebug \
            --stacktrace

      # 12. Verify generated APK
      - name: Verify APK
        run: |
          set -e

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 13. Upload APK artifact
      - name: Upload DreamX Homes APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamX-Homes-Android-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
