
name: Build DreamX Homes APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build DreamX Homes APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Configure Android SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      # 5. Find SDK Manager
      - name: Find SDK Manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

      # 6. Accept licenses
      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      # 7. Install Android SDK
      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. Extract Android project
      - name: Extract DreamX Homes project
        run: |
          test -f DreamX_Homes_Android_Project.zip

          mkdir -p android-project

          unzip -o DreamX_Homes_Android_Project.zip \
            -d android-project

          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle

      # 9. Fix complete Android build configuration
      - name: Configure Android and Kotlin
        working-directory: android-project
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.dreamxhomes.reelmaker'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.dreamxhomes.reelmaker'
                  minSdk 26
                  targetSdk 35
                  versionCode 12
                  versionName '0.10.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.activity:activity-ktx:1.9.3'
          }
          EOF

          echo "Android build configuration:"
          cat app/build.gradle

      # 10. Verify project source
      - name: Verify Kotlin source files
        working-directory: android-project
        run: |
          find app/src/main -name "*.kt" -type f
          test -f app/src/main/AndroidManifest.xml

      # 11. Build APK
      - name: Build DreamX Homes APK
        run: |
          gradle --no-daemon \
            -p android-project \
            clean assembleDebug \
            --stacktrace

      # 12. Verify APK
      - name: Verify APK
        run: |
          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      # 13. Upload APK
      - name: Upload DreamX Homes APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamX-Homes-Android-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
