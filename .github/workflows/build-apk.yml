

name: Build DreamX Homes APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/dreamx
          unzip -q DreamX_Homes_Android_Project.zip -d /tmp/dreamx
          cp -R /tmp/dreamx/app .
          cp /tmp/dreamx/build.gradle .
          cp /tmp/dreamx/settings.gradle .
          cp /tmp/dreamx/gradle.properties .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamX-Homes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
